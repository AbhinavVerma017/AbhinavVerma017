<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#1a0b0f"/>
      <stop offset="100%" stop-color="#3a0a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'Fira Code',Consolas,'Courier New',monospace}
      .fade{animation:in 1s ease both}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .pulse{animation:p 2.4s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
      .flow{stroke-dasharray:6 8;animation:f 1.2s linear infinite}
      @keyframes f{to{stroke-dashoffset:-14}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)"/>

  <!-- left text -->
  <text x="60" y="88" class="m fade d1" font-size="16" fill="#ff7a59">&lt;backend-engineer /&gt;</text>
  <text x="60" y="140" class="t fade d1" font-size="46" font-weight="700" fill="#ffffff">Abhinav Verma</text>
  <rect x="60" y="156" width="120" height="4" rx="2" fill="url(#accent)" class="fade d2"/>
  <text x="60" y="194" class="t fade d2" font-size="19" fill="#c9d1d9">APIs · Async pipelines · AI-powered services</text>
  <text x="60" y="224" class="m fade d3" font-size="14" fill="#8b949e">Gurugram, India</text>

  <!-- right: mini architecture diagram -->
  <g class="fade d3" font-size="13">
    <line x1="660" y1="80" x2="760" y2="80" stroke="#E50914" stroke-width="2" class="flow"/>
    <line x1="820" y1="100" x2="820" y2="150" stroke="#E50914" stroke-width="2" class="flow"/>
    <line x1="760" y1="180" x2="660" y2="180" stroke="#E50914" stroke-width="2" class="flow"/>

    <rect x="580" y="60" width="80" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="620" y="85" text-anchor="middle" class="m" fill="#c9d1d9">API</text>

    <rect x="760" y="60" width="120" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="820" y="85" text-anchor="middle" class="m" fill="#c9d1d9">Queue</text>

    <rect x="760" y="150" width="120" height="40" rx="8" fill="#161b22" stroke="#E50914"/>
    <text x="820" y="175" text-anchor="middle" class="m" fill="#ffffff">LLM ✦</text>

    <rect x="560" y="160" width="100" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="610" y="185" text-anchor="middle" class="m" fill="#c9d1d9">Database</text>

    <circle cx="900" cy="170" r="5" fill="#E50914" class="pulse"/>
  </g>
</svg>
